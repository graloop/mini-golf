# nginx site for golf.graloop.com -> mini-golf container on 127.0.0.1:3000
# Install: copy to /etc/nginx/sites-available/ (or conf.d/), enable, `nginx -t && systemctl reload nginx`.
# Requires a certificate: sudo certbot certonly --nginx -d golf.graloop.com

# --- http-context definitions (this file is included inside http {}) ---
limit_req_zone  $binary_remote_addr zone=golf_req:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=golf_conn:10m;

map $http_upgrade $golf_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream golf_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# --- HTTP: redirect everything to HTTPS (except ACME challenges) ---
server {
    listen 80;
    listen [::]:80;
    server_name golf.graloop.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name golf.graloop.com;

    ssl_certificate     /etc/letsencrypt/live/golf.graloop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/golf.graloop.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The app only serves 3 small files and a WebSocket: no request bodies needed.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 15s;

    limit_conn golf_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    # Only the paths the app actually serves
    location = / {
        limit_req zone=golf_req burst=20 nodelay;

        # WebSocket upgrades also use "/"
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $golf_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep idle game sockets open (the server pings every 30s)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;

        proxy_pass http://golf_backend;
    }

    location ~ ^/(client\.js|style\.css)$ {
        limit_req zone=golf_req burst=20 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://golf_backend;
    }

    location / {
        return 404;
    }
}
